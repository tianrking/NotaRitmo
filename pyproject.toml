[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notaritmo"
version = "0.1.0"
description = "Evidence-first Linux meeting analysis, memory, and retrieval platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "aliyun-python-sdk-core==2.16.0",
  "fastapi==0.116.1",
  "fastembed==0.8.0",
  "graphiti-core==0.29.2",
  "httpx==0.28.1",
  "jieba==0.42.1",
  "langgraph==1.2.9",
  "minio==7.2.16",
  "neo4j==6.2.0",
  "pgvector==0.4.1",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.43",
  "temporalio==1.18.1",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.12",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
